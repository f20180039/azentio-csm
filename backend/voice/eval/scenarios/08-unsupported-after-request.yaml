id: 08-unsupported-after-request
title: Keep a service request and route an unrelated question
customer: {mobile: "9731462580", dob: "1985-11-03"}
turns:
  - say: "I need a repayment schedule for my loan."
    expect: {intents: [SERVICE_REQUEST]}
  - say: "My number is 97314 62580 and date of birth third November nineteen eighty-five."
    expect: {intents: [IDENTITY], verified: true}
  - say: "Please raise that schedule request."
    expect: {intents: [SERVICE_REQUEST], creates: {ticket: REPAYMENT_SCHEDULE}}
  - say: "Can you book me a flight to Dubai?"
    expect: {intents: [UNSUPPORTED], routed: true, must_say_any: ["can't", "cannot", "unable", "not able", "don't"]}
outcome: {tickets: 1, complaints: 0, routed: 1, escalations: 0}
