turns:
  - say: "When is my personal loan EMI due?"
    expect: {intents: [REPAYMENT]}
  - say: "My number is 97314 62580 and my date of birth is the third of November nineteen eighty-five."
    expect: {intents: [IDENTITY], verified: true}
