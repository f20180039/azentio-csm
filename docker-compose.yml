name: case-intel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caseintel
      POSTGRES_USER: caseintel
      POSTGRES_PASSWORD: caseintel
    ports:
      - "5433:5432"   # host 5432 is taken by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseintel -d caseintel"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    build: ./agent
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/caseintel
      AGENT_URL: http://agent:8000
      CORS_ORIGINS: http://localhost:5173
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: http://localhost:8080/api/v1
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
