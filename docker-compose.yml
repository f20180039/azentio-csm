name: azentio-csm

# Host ports move with API_PORT, SIMULATOR_PORT, VOICE_PORT and WEB_PORT,
# e.g. to run beside services started natively on the default ports.
services:
  api:
    build: ./backend/api
    environment:
      API_DB_PATH: /app/data/runtime/api.db
      ENFORCE_CALLING_HOURS: ${ENFORCE_CALLING_HOURS:-false}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api-data:/app/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  simulator:
    build: ./backend/simulator
    environment:
      SIMULATOR_DB_PATH: /app/data/runtime/simulator.db
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'
    ports:
      - "${SIMULATOR_PORT:-8090}:8090"
    volumes:
      - simulator-data:/app/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  voice:
    build: ./backend/voice
    env_file:
      - path: .env
        required: false
    environment:
      RENEWALS_API_BASE: http://api:8080/api/v1
      SIMULATOR_BASE: http://simulator:8090/v1
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
      OLLAMA_OPENAI_BASE: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      simulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VOICE_PORT:-7861}:7861"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7861/health')"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:${API_PORT:-8080}/api/v1
        VITE_VOICE_BASE: http://localhost:${VOICE_PORT:-7861}
        VITE_SIMULATOR_BASE: http://localhost:${SIMULATOR_PORT:-8090}/v1
    depends_on:
      api:
        condition: service_healthy
      simulator:
        condition: service_healthy
      voice:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  api-data:
  simulator-data:
