name: case-intel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caseintel
      POSTGRES_USER: caseintel
      POSTGRES_PASSWORD: caseintel
    ports:
      - "5433:5432"   # host 5432 is taken by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseintel -d caseintel"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend/api
    ports:
      - "8080:8080"
    environment:
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./data/api:/app/data

  simulator:
    build: ./backend/simulator
    ports:
      - "8090:8090"
    volumes:
      - ./data/simulator:/app/data/runtime

  voice:
    build: ./backend/voice
    env_file:
      - path: .env
        required: false
    environment:
      RENEWALS_API_BASE: http://api:8080/api/v1
      SIMULATOR_BASE: http://simulator:8090/v1
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      - api
      - simulator
    ports:
      - "127.0.0.1:7861:7861"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8080/api/v1
        VITE_VOICE_BASE: http://localhost:7861
    depends_on:
      - api
      - voice
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
